<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kappa Tracker by Danial{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-top"
            <h1>Kappa Tracker by Danial</h1>
            {% block progress_bar %}{% endblock %}
        </div>
        <nav>
            <a href="/">Главная</a>
            <a href="/tree">Дерево квестов</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <small>Локальный трекер • Данные с tarkov.dev</small>
    </footer>
</body>
</html>
