[project]
name = "tarkov-kappa-tracker"
version = "0.1.0"
description = "Personal web tracker for Escape From Tarkov quests to obtain the Ka"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.1 || >3.14.1"
dependencies = [
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.13.0)",
    "certifi (==2026.2.25)",
    "click (==8.3.2)",
    "colorama (==0.4.6)",
    "fastapi (==0.135.3)",
    "h11 (==0.16.0)",
    "httpcore (==1.0.9)",
    "httpx (==0.28.1)",
    "idna (==3.11)",
    "jinja2 (==3.1.6)",
    "markupsafe (==3.0.3)",
    "networkx (==3.6.1)",
    "pydantic (==2.13.0)",
    "pydantic-core (==2.46.0)",
    "starlette (==1.0.0)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "uvicorn (==0.44.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
